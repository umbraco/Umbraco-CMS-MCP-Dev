trigger:
  branches:
    include:
    - main
    - v17/main
    - v17/dev
    - feature/*

resources:
  repositories:
  - repository: build
    type: github
    name: Umbraco/Umbraco.Build
    endpoint: github.com_umbraco

parameters:
  - name: sbom_generate
    displayName: Generate SBOM
    type: boolean
    default: false

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '22.x'
  # Dependency-Track product name
  - name: productName
    value: 'Umbraco.Cms.Mcp-Dev'

stages:
- stage: BuildAndTest
  displayName: 'Build'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'
    
    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: 'node_modules'
    
    - script: npm ci
      displayName: 'Install dependencies'
    
    - script: npm run build
      displayName: 'Build TypeScript'
    
    - script: npm pack --pack-destination $(Build.ArtifactStagingDirectory)
      displayName: 'Create NPM package'
    
    - task: PublishPipelineArtifact@1
      displayName: 'Publish NPM package to artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'npm-package'

# Runs in parallel with the build and gates the npm release: a failed SBOM (e.g. a license policy
# violation) must stop a publish. Runs on the same branches as Deploy_Npm (main or v17/main), or on any
# branch when sbom_generate is set (a forced run is not flagged isLatest in Dependency-Track).
- stage: GenerateSBOM
  displayName: Generate SBOM
  dependsOn: []
  condition: or(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/v17/main'), eq('${{ parameters.sbom_generate }}', 'true'))
  variables:
  - group: dependency-track
  jobs:
  - job: GenerateSBOM
    displayName: Generate SBOM
    steps:
    - template: devops/templates/generate-sbom-template.yml@build
      parameters:
        sbom_nuget: false
        sbom_npm_paths: ['.']
        sbom_version_from: package.json # e.g. version 17.6.11 is uploaded to project "Umbraco.Cms.Mcp-Dev v17"
        # a run forced with sbom_generate must not displace the latest version in Dependency-Track
        ${{ if eq(parameters.sbom_generate, true) }}:
          sbom_is_latest: 'false'

- stage: Deploy_Npm
  displayName: Npm release
  condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/v17/main'))
  dependsOn:
    - BuildAndTest
    - GenerateSBOM
  jobs:
    - job: Publish
      displayName: Push to NPM
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - script: |
            # Extract versions from package.json and server.json
            PKG_VERSION=$(node -p "require('./package.json').version")
            SERVER_VERSION=$(node -p "require('./server.json').version")
            SERVER_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")

            # Validate all versions match
            if [ "$PKG_VERSION" != "$SERVER_VERSION" ] || [ "$PKG_VERSION" != "$SERVER_PKG_VERSION" ]; then
              echo "##vso[task.logissue type=error]Version mismatch detected!"
              echo "package.json version: $PKG_VERSION"
              echo "server.json version: $SERVER_VERSION"
              echo "server.json packages[0].version: $SERVER_PKG_VERSION"
              exit 1
            fi
            echo "Version validation passed: $PKG_VERSION"
          displayName: 'Validate version sync between package.json and server.json'
        - download: current
          artifact: 'npm-package'
        - bash: echo "@umbraco-cms:registry=https://registry.npmjs.org" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/npm-package
          displayName: Add scoped registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with npm
          inputs:
            workingFile: $(Pipeline.Workspace)/npm-package/.npmrc
            customEndpoint: "NPM - Umbraco Backoffice"
        - script: |
            # Setup temp npm project to load in defaults from the local .npmrc
            npm init -y

            # Find the first .tgz file in the current directory
            files=( ./*.tgz )

            # Extract version from package.json in the tarball
            tar -tf "${files[0]}" | grep package/package.json | head -1 | xargs tar -xf "${files[0]}" --strip-components=1
            version=$(node -p "require('./package.json').version")

            # Determine release channel from version
            if [[ "${version}" == *"alpha"* ]]; then
              channel="alpha"
            elif [[ "${version}" == *"beta"* ]]; then
              channel="beta"
            elif [[ "${version}" == *"rc"* ]]; then
              channel="rc"
            else
              channel="latest"
            fi

            # Map channel to dist-tag, scoping the v17 line to lts-17*
            if [[ "${BUILD_SOURCEBRANCH}" == "refs/heads/v17/main" ]]; then
              if [ "$channel" = "latest" ]; then
                tag="lts-17"
              else
                tag="lts-17-${channel}"
              fi
            else
              tag="$channel"
            fi

            echo "Publishing version ${version} with tag ${tag}"
            if ! npm publish "${files[0]}" --tag $tag --access public; then
              echo "##vso[task.logissue type=error]npm publish failed for version ${version}"
              exit 1
            fi

            # Set output variable for MCP Registry stage
            if [ "$channel" = "latest" ]; then
              echo "##vso[task.setvariable variable=isStable;isOutput=true]true"
            else
              echo "##vso[task.setvariable variable=isStable;isOutput=true]false"
            fi
          name: npmPublish
          displayName: Push to npm with dynamic tagging
          workingDirectory: $(Pipeline.Workspace)/npm-package

