name: Test

on:
  pull_request:
    branches: [main, dev, v18/dev]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Moloko99
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Moloko99 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      UMBRACO_CLIENT_ID: umbraco-back-office-mcp
      UMBRACO_CLIENT_SECRET: '1234567890'
      UMBRACO_BASE_URL: https://localhost:44391
      NODE_TLS_REJECT_UNAUTHORIZED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Build
        run: npm run build

      - name: Setup .NET dev certs
        run: dotnet dev-certs https

      - name: Bootstrap demo-site from template
        run: bash scripts/bootstrap-demo-site.sh

      - name: Configure Umbraco for CI
        run: |
          cat > demo-site/appsettings.Local.json << 'EOF'
          {
            "ConnectionStrings": {
              "umbracoDbDSN": "Server=localhost,1433;Database=umbraco-mcp-ci;User Id=sa;password=Moloko99;TrustServerCertificate=True",
              "umbracoDbDSN_ProviderName": "Microsoft.Data.SqlClient"
            }
          }
          EOF

      - name: Start Umbraco
        run: |
          cd demo-site
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS="http://localhost:56472;https://localhost:44391" \
          dotnet run --no-launch-profile > /tmp/umbraco.log 2>&1 &
          echo $! > /tmp/umbraco.pid

      - name: Wait for Umbraco
        run: |
          echo "Waiting for Umbraco runtime to reach 'Run'..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf http://localhost:56472/umbraco/management/api/v1/server/status 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('serverStatus',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "Run" ]; then
              echo "Umbraco is ready (serverStatus=Run)"
              exit 0
            fi
            # Check if process died
            if ! kill -0 $(cat /tmp/umbraco.pid) 2>/dev/null; then
              echo "Umbraco process died! Last 50 lines of log:"
              tail -50 /tmp/umbraco.log
              exit 1
            fi
            echo "Attempt $i/60 - serverStatus='${STATUS:-unreachable}' - waiting 5s..."
            sleep 5
          done
          echo "Umbraco failed to reach 'Run' within 5 minutes. Last 50 lines of log:"
          tail -50 /tmp/umbraco.log
          exit 1
        timeout-minutes: 6

      - name: Create API user
        run: node scripts/create-api-user.mjs http://localhost:56472 admin@admin.com 1234567890

      - name: Run tests
        id: unit-integration
        run: npm test -- --no-coverage

      - name: Test failure report
        if: failure() && steps.unit-integration.outcome == 'failure'
        run: |
          echo "## Test Failures" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-failures.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No failure log found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: List Playwright OS dependencies
        id: playwright-os-deps
        run: |
          # --dry-run exits 1 on the normal "packages are missing" path, so don't
          # let that fail the step — instead check the actual output shape rather
          # than assuming success by line position (it also has a distinct failure
          # shape, e.g. an unresolvable package name after an OS image bump).
          OUT=$(npx playwright install-deps chromium --dry-run 2>&1) || true
          if printf '%s\n' "$OUT" | grep -q '^All system dependencies are installed\.'; then
            echo "packages=" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$OUT" | grep -q '^Missing system dependencies'; then
            # Scope extraction to lines after the header so a stray two-space-indented
            # token elsewhere in merged stdout/stderr can't be picked up as a package.
            DEPS=$(printf '%s\n' "$OUT" | sed -n '/^Missing system dependencies/,$ { s/^  \([a-zA-Z0-9][a-zA-Z0-9.+-]*\)$/\1/p }' | sort | tr '\n' ' ')
            echo "packages=$DEPS" >> "$GITHUB_OUTPUT"
            # The apt cache key below is derived from a digest, not the raw list, so
            # it can't blow past GitHub's 512-char cache-key limit as the package set
            # (and its transitive closure) grows.
            echo "hash=$(printf '%s' "$DEPS" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected output from 'playwright install-deps --dry-run'"
            printf '%s\n' "$OUT"
            exit 1
          fi
        timeout-minutes: 2

      - name: Compute apt cache week
        if: steps.playwright-os-deps.outputs.packages != ''
        id: apt-cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright OS dependency archives
        if: steps.playwright-os-deps.outputs.packages != ''
        uses: actions/cache@v6
        id: apt-cache
        with:
          # /var/cache/apt/archives is root-owned; actions/cache runs as the
          # unprivileged runner user and can't write into it, so cache a
          # workspace-owned mirror instead and copy files in/out around apt.
          path: ${{ github.workspace }}/.apt-cache
          key: apt-playwright-deps-${{ runner.os }}-${{ steps.playwright-os-deps.outputs.hash }}-${{ steps.apt-cache-week.outputs.week }}
          restore-keys: |
            apt-playwright-deps-${{ runner.os }}-${{ steps.playwright-os-deps.outputs.hash }}-

      - name: Install Playwright OS dependencies
        if: steps.playwright-os-deps.outputs.packages != ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.apt-cache"
          if [ -n "$(ls -A "$GITHUB_WORKSPACE/.apt-cache" 2>/dev/null)" ]; then
            sudo cp "$GITHUB_WORKSPACE"/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 install -y --no-install-recommends ${{ steps.playwright-os-deps.outputs.packages }}
          # Refresh the workspace-owned mirror so a cache save (skipped on an exact
          # key hit, but this week's key is fresh on rotation) picks up any newly
          # downloaded/updated .deb files, chowned back to the runner user.
          sudo cp /var/cache/apt/archives/*.deb "$GITHUB_WORKSPACE/.apt-cache/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.apt-cache"
        timeout-minutes: 5

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  evals:
    name: LLM Eval Tests
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Moloko99
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Moloko99 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      UMBRACO_CLIENT_ID: umbraco-back-office-mcp
      UMBRACO_CLIENT_SECRET: '1234567890'
      UMBRACO_BASE_URL: https://localhost:44391
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup .NET dev certs
        run: dotnet dev-certs https

      - name: Bootstrap demo-site from template
        run: bash scripts/bootstrap-demo-site.sh

      - name: Configure Umbraco for CI
        run: |
          cat > demo-site/appsettings.Local.json << 'EOF'
          {
            "ConnectionStrings": {
              "umbracoDbDSN": "Server=localhost,1433;Database=umbraco-mcp-ci-evals;User Id=sa;password=Moloko99;TrustServerCertificate=True",
              "umbracoDbDSN_ProviderName": "Microsoft.Data.SqlClient"
            }
          }
          EOF

      - name: Start Umbraco
        run: |
          cd demo-site
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS="http://localhost:56472;https://localhost:44391" \
          dotnet run --no-launch-profile > /tmp/umbraco.log 2>&1 &
          echo $! > /tmp/umbraco.pid

      - name: Wait for Umbraco
        run: |
          echo "Waiting for Umbraco runtime to reach 'Run'..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf http://localhost:56472/umbraco/management/api/v1/server/status 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('serverStatus',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "Run" ]; then
              echo "Umbraco is ready (serverStatus=Run)"
              exit 0
            fi
            # Check if process died
            if ! kill -0 $(cat /tmp/umbraco.pid) 2>/dev/null; then
              echo "Umbraco process died! Last 50 lines of log:"
              tail -50 /tmp/umbraco.log
              exit 1
            fi
            echo "Attempt $i/60 - serverStatus='${STATUS:-unreachable}' - waiting 5s..."
            sleep 5
          done
          echo "Umbraco failed to reach 'Run' within 5 minutes. Last 50 lines of log:"
          tail -50 /tmp/umbraco.log
          exit 1
        timeout-minutes: 6

      - name: Create API user
        run: node scripts/create-api-user.mjs http://localhost:56472 admin@admin.com 1234567890

      - name: Run eval tests
        run: npm run test:evals
