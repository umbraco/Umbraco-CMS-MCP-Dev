name: Temp Regenerate Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/issue-650-upgrade-1.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Remove scratch diagnostic file and regenerate lockfile
        run: |
          rm -f .scratch-size-test.txt
          rm -f package-lock.json
          npm install
          rm -f .github/workflows/_tmp-regen-lockfile.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: regenerate package-lock.json for 1.0.0 bump; remove temp scratch/workflow files"
          git push origin HEAD:feature/issue-650-upgrade-1.0.0
